name: Sync AMIS inventory

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write AMIS stock to the website (false = preview only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: amis-stock-hcm3
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.AMIS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-stock.txt
      - name: Validate inventory handling
        run: python -m unittest discover -s tests -p 'test_amis_stock.py' -v
      - name: Synchronize HCM 3
        env:
          AMIS_CLIENT_ID: ${{ secrets.AMIS_CLIENT_ID }}
          AMIS_CLIENT_SECRET: ${{ secrets.AMIS_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AMIS_STOCK_CODE: HCM 3
          APPLY_STOCK: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY_STOCK" = "true" ]; then
            python scripts/sync_amis_stock.py --apply
          else
            python scripts/sync_amis_stock.py
          fi
